name: Deploy Backend Production

on:
  push:
    branches: [main]
    paths: ["sikouta-be/**", ".github/workflows/backend.yml", ".github/actions/server-ssh/**", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-sikouta-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sikouta-be/go.mod
          cache-dependency-path: sikouta-be/go.sum
      - name: Test backend
        working-directory: sikouta-be
        run: go test ./internal/router ./internal/service ./internal/provider ./internal/repository ./internal/helper
      - name: Build backend artifact
        working-directory: sikouta-be
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p release
          go build -trimpath -buildvcs=false -o release/sikouta-be .
          tar -C release -czf ../sikouta-backend.tgz .
      - uses: ./.github/actions/server-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Upload and activate backend
        env:
          RELEASE_DIR: ${{ secrets.BACKEND_RELEASE_DIR }}
        run: |
          set -euo pipefail
          upload="/tmp/sikouta-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          digest="$(sha256sum sikouta-backend.tgz | cut -d ' ' -f 1)"
          scp sikouta-backend.tgz "sikouta-production:$upload"
          ssh sikouta-production bash -s -- backend "$RELEASE_DIR" "$upload" "$digest" "$GITHUB_SHA" < .github/scripts/activate-release.sh
