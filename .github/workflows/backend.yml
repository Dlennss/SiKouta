name: Deploy Backend Production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend.yml"
      - "sikouta-be/**"
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend and restart production services
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || secrets.USERNAME }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || secrets.PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT || secrets.SERVER_PORT || '22' }}
      BACKEND_SOURCE_DIR: ${{ secrets.BACKEND_SOURCE_DIR || '/var/lib/syslog-ng/sikouta/SiKouta/sikouta-be' }}
      BACKEND_RELEASE_DIR: ${{ secrets.BACKEND_RELEASE_DIR || '/var/lib/syslog-ng/sikouta/releases/sikouta-be/current' }}
      BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME || 'sikouta-be.service' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" || (echo "SERVER_HOST secret is required" && exit 1)
          test -n "$SERVER_USER" || (echo "SERVER_USER secret is required" && exit 1)
          test -n "$SERVER_PASSWORD" || (echo "SERVER_PASSWORD secret is required" && exit 1)

      - name: Install deployment tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y sshpass rsync

      - name: Prepare SSH connection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify server authentication
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          sshpass -e ssh -o ConnectTimeout=15 -o NumberOfPasswordPrompts=1 -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" "true"

      - name: Prepare server backend runtime
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          printf '%s\n' "$SERVER_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" "sudo -S -p '' bash -s" <<REMOTE
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl rsync
          if ! command -v go >/dev/null 2>&1; then
            GO_VERSION=1.24.2
            ARCH=\$(dpkg --print-architecture)
            case "\$ARCH" in
              amd64) GO_ARCH=amd64 ;;
              arm64) GO_ARCH=arm64 ;;
              *) echo "Unsupported architecture: \$ARCH" >&2; exit 1 ;;
            esac
            curl -fsSL "https://go.dev/dl/go\${GO_VERSION}.linux-\${GO_ARCH}.tar.gz" -o /tmp/go.tgz
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            ln -sfn /usr/local/go/bin/go /usr/local/bin/go
            ln -sfn /usr/local/go/bin/gofmt /usr/local/bin/gofmt
          fi
          install -d /var/lib/syslog-ng/sikouta
          install -d "$BACKEND_SOURCE_DIR"
          install -d "\$(dirname "$BACKEND_RELEASE_DIR")"
          install -d /var/lib/syslog-ng/sikouta/logs
          install -d /var/lib/syslog-ng/sikouta/shared-bin
          chown -R "$SERVER_USER" /var/lib/syslog-ng/sikouta
          go version
          REMOTE

      - name: Sync backend source
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          sshpass -e rsync -az --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'log' \
            --exclude 'releases' \
            --exclude 'sikouta-be' \
            --exclude 'serbabayar-be' \
            --exclude 'pulsa-be' \
            sikouta-be/ "$SERVER_USER@$SERVER_HOST:$BACKEND_SOURCE_DIR/"
          sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "test -f '$BACKEND_SOURCE_DIR/chytron/client.go' && test -f '$BACKEND_SOURCE_DIR/scripts/deploy-prod-release.sh'"

      - name: Write backend environment
        shell: bash
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          if [[ -z "$BACKEND_ENV" ]]; then
            echo "BACKEND_ENV is empty; keeping the existing server environment."
            exit 0
          fi
          printf '%s\n' "$BACKEND_ENV" | sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cat > '$BACKEND_SOURCE_DIR/.env' && chmod 600 '$BACKEND_SOURCE_DIR/.env'"

      - name: Build and publish backend release
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd '$BACKEND_SOURCE_DIR' && PATH='/usr/local/go/bin:/usr/local/bin:$PATH' SOURCE_DIR='$BACKEND_SOURCE_DIR' RELEASE_ROOT=\"\$(dirname '$BACKEND_RELEASE_DIR')\" SHARED_LOG_DIR='/var/lib/syslog-ng/sikouta/logs' SKIP_SERVICE_RESTART=true bash scripts/deploy-prod-release.sh"

      - name: Restart SiKouta backend and Nginx
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          printf '%s\n' "$SERVER_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" "sudo -S -p '' bash -s" <<REMOTE
          set -euo pipefail
          if [ ! -f /etc/systemd/system/$BACKEND_SERVICE_NAME ]; then
            cat > /etc/systemd/system/$BACKEND_SERVICE_NAME <<UNIT
          [Unit]
          Description=SiKouta Backend
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$SERVER_USER
          WorkingDirectory=$BACKEND_RELEASE_DIR
          EnvironmentFile=-$BACKEND_RELEASE_DIR/.env
          Environment=PORT=8091
          ExecStart=$BACKEND_RELEASE_DIR/sikouta-be
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT
          fi
          install -d /etc/systemd/system/$BACKEND_SERVICE_NAME.d
          cat > /etc/systemd/system/$BACKEND_SERVICE_NAME.d/release.conf <<UNIT
          [Service]
          WorkingDirectory=$BACKEND_RELEASE_DIR
          ExecStart=
          ExecStart=$BACKEND_RELEASE_DIR/sikouta-be
          UNIT
          systemctl daemon-reload
          systemctl enable $BACKEND_SERVICE_NAME
          nginx -t
          if ! systemctl restart $BACKEND_SERVICE_NAME nginx || ! systemctl is-active --quiet $BACKEND_SERVICE_NAME nginx; then
            journalctl -u $BACKEND_SERVICE_NAME -n 120 --no-pager || true
            systemctl --no-pager --full status $BACKEND_SERVICE_NAME nginx || true
            exit 1
          fi
          REMOTE
          sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "for attempt in \$(seq 1 60); do
               if curl --fail --silent http://127.0.0.1:8091/health >/dev/null; then
                 echo 'SiKouta backend siap.'
                 exit 0
               fi
               sleep 2
             done
             echo 'Backend belum siap setelah 120 detik.' >&2
             systemctl --no-pager --full status '$BACKEND_SERVICE_NAME' || true
             exit 1"
