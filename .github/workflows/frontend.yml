name: Deploy Frontend Production

on:
  push:
    branches: [main]
    paths: ["sikouta-fe/**", ".github/workflows/frontend.yml", ".github/actions/server-ssh/**", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-sikouta-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sikouta-fe/package-lock.json
      - name: Install dependencies
        working-directory: sikouta-fe
        run: npm ci
      - name: Build standalone frontend
        working-directory: sikouta-fe
        env:
          API_BASE: http://127.0.0.1:33111
          NEXT_PUBLIC_API_BASE: https://sikouta.com/api
          NEXTAUTH_URL: https://sikouta.com
          NEXT_PUBLIC_SITE_URL: https://sikouta.com
          NEXT_PUBLIC_TURNSTILE_ENABLED: "false"
          NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: "false"
          GOOGLE_LOGIN_ENABLED: "false"
        run: npm run build
      - name: Package frontend and assets
        working-directory: sikouta-fe
        run: |
          set -euo pipefail
          mkdir -p release/.next release/public
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public/. release/public/
          test -f release/server.js
          test -f release/public/favicon.ico
          tar -C release -czf ../sikouta-frontend.tgz .
      - uses: ./.github/actions/server-ssh
        with:
          host: ${{ secrets.SERVER_HOST }}
          user: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Upload and activate frontend
        env:
          RELEASE_DIR: ${{ secrets.FRONTEND_RELEASE_DIR }}
        run: |
          set -euo pipefail
          upload="/tmp/sikouta-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          digest="$(sha256sum sikouta-frontend.tgz | cut -d ' ' -f 1)"
          scp sikouta-frontend.tgz "sikouta-production:$upload"
          ssh sikouta-production bash -s -- frontend "$RELEASE_DIR" "$upload" "$digest" "$GITHUB_SHA" < .github/scripts/activate-release.sh
